# Wheel wrapping the release binaries (see Dockerfile), so `uv`/`pip` can install cpp-bundle
# and cpp-minify: build the binaries into dist/, then `CPP_BUNDLE_VERSION=x.y.z uv build --wheel`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpp-bundle"
dynamic = ["version"]
description = "cpp-bundle and cpp-minify: a clang-based C++ header bundler and token minifier"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/ecnerwala/cpp-bundle"

[tool.hatch.version]
source = "env"
variable = "CPP_BUNDLE_VERSION"

[tool.hatch.build.targets.wheel]
bypass-selection = true
shared-scripts = { "dist/cpp-bundle" = "cpp-bundle", "dist/cpp-minify" = "cpp-minify" }

[tool.hatch.build.targets.wheel.hooks.custom]
