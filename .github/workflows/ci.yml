name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y clang-20 libclang-20-dev llvm-20-dev
      - run: cmake -S . -B build -DClang_DIR=/usr/lib/llvm-20/lib/cmake/clang
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --output type=local,dest=dist .
      - run: ls -l dist && dist/cpp-minify --check tests/fixtures/basic/main.cpp >/dev/null
      - run: |
          CPP_BUNDLER_VERSION=0.0.0 pipx run build --wheel
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/cpp-minify --check tests/fixtures/basic/main.cpp >/dev/null
