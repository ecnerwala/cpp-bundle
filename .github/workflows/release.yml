name: release
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'Dockerfile', 'CMakeLists.txt', 'pyproject.toml', 'hatch_build.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-14, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: version
        run: |
          version=0.0.0
          [ "$GITHUB_REF_TYPE" = tag ] && version=${GITHUB_REF_NAME#v}
          echo "CPP_BUNDLER_VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=cpp-bundler-v$version-${{ matrix.target }}" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: docker build --output type=local,dest=dist .
      - if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DClang_DIR="$(brew --prefix llvm@20)/lib/cmake/clang"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          CXX="$(brew --prefix llvm@20)/bin/clang++" ctest --test-dir build --output-on-failure
          mkdir dist && cp build/cpp-bundle build/cpp-minify dist && strip dist/cpp-bundle dist/cpp-minify
          otool -L dist/cpp-bundle dist/cpp-minify
          echo "CPP_BUNDLER_WHEEL_TAG=py3-none-macosx_$(sw_vers -productVersion | cut -d. -f1)_0_$(uname -m)" >> "$GITHUB_ENV"
      - run: |
          tar -C dist -czf "$ARCHIVE.tar.gz" cpp-bundle cpp-minify
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv build --wheel
          if [ "$RUNNER_OS" = Linux ]; then
            uvx --with patchelf auditwheel repair -w wheelhouse dist/*.whl
          else
            mkdir wheelhouse && cp dist/*.whl wheelhouse
          fi
          uvx --from wheelhouse/*.whl cpp-minify --check tests/fixtures/basic/main.cpp >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-bundler-${{ matrix.target }}
          path: |
            cpp-bundler-*.tar.gz*
            wheelhouse/*.whl
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes cpp-bundler-*.tar.gz* *.whl
